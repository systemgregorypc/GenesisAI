<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - GÉNESIS AI</title>
    <style>
        body { 
            background: #0e0e0e; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            transition: background 0.4s, color 0.4s;
        }

        /* ESTILOS DE LA LÁMPARA CON ANIMACIÓN DE TIRÓN */
        .hanging-lamp {
            position: absolute;
            top: 0;
            left: 50%;
            transform-origin: top center;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            cursor: pointer;
        }
        .lamp-wire {
            width: 2px;
            height: 90px;
            background: #555;
            transition: background 0.4s;
        }
        .lamp-shade {
            width: 50px;
            height: 25px;
            background: #222;
            border-radius: 0 0 25px 25px;
            border: 1px solid #444;
            transition: background 0.4s, border-color 0.4s;
        }
        .lamp-bulb {
            width: 20px;
            height: 20px;
            background: #333;
            border-radius: 50%;
            margin-top: -4px;
            box-shadow: 0 0 10px rgba(0,0,0,0.9);
            transition: background 0.3s, box-shadow 0.3s;
        }
        .pull-chain {
            width: 2px;
            height: 35px;
            background: #888;
            position: relative;
        }
        .pull-chain::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: -3px;
            width: 8px;
            height: 8px;
            background: #aaa;
            border-radius: 50%;
        }

        /* CLASE DE ANIMACIÓN PARA EL BALEO (TIRÓN) */
        @keyframes pullAndSwing {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(8deg); }
            40% { transform: rotate(-6deg); }
            60% { transform: rotate(4deg); }
            80% { transform: rotate(-2deg); }
            100% { transform: rotate(0deg); }
        }
        .swing {
            animation: pullAndSwing 0.6s ease-in-out;
        }

        /* ESTADO LUZ ENCENDIDA */
        body.light-on {
            background: #f4f6f8;
            color: #0e0e0e;
        }
        body.light-on .login-box {
            background: #ffffff;
            border-color: #cbd5e1;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        body.light-on .lamp-wire { background: #888; }
        body.light-on .lamp-shade { background: #e2e8f0; border-color: #cbd5e1; }
        body.light-on .lamp-bulb {
            background: #facc15;
            box-shadow: 0 0 40px #facc15, 0 0 80px #facc15;
        }
        body.light-on input {
            background: #f8fafc;
            color: #0e0e0e;
            border-color: #cbd5e1;
        }
        body.light-on label { color: #64748b; }
        body.light-on .footer-logo { color: #94a3b8; }

        /* CONTENEDOR DE LOGIN ORIGINAL */
        .login-box { 
            background: #1a1a1a; 
            padding: 40px; 
            border-radius: 15px; 
            border: 1px solid #6133FF; 
            box-shadow: 0 0 20px rgba(97, 51, 255, 0.2); 
            width: 350px; 
            text-align: center;
            transition: background 0.3s, border 0.3s, box-shadow 0.3s;
            margin-top: 50px;
        }
        h2 { color: #6133FF; margin-bottom: 30px; letter-spacing: 3px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { color: #888; font-size: 0.8em; margin-bottom: 5px; display: block; }
        input { 
            width: 100%; 
            padding: 12px; 
            background: #222; 
            border: 1px solid #333; 
            border-radius: 5px; 
            color: white; 
            box-sizing: border-box;
            transition: 0.3s;
        }
        input:focus { border-color: #6133FF; outline: none; background: #2a2a2a; }
        .btn-access { 
            width: 100%; 
            padding: 12px; 
            background: #6133FF; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1em;
            margin-top: 10px;
        }
        .btn-access:hover { background: #4b28cc; }
        .footer-logo { margin-top: 30px; font-size: 0.7em; color: #444; }
        a { color: #6133FF; text-decoration: none; font-size: 0.85em; display: block; margin-top: 15px; }
    </style>
</head>
<body>

    <!-- LÁMPARA COLGANTE CON ANIMACIÓN DE TIRÓN -->
    <div class="hanging-lamp" id="lampTrigger" title="Haz clic para tirar de la cuerda">
        <div class="lamp-wire"></div>
        <div class="lamp-shade"></div>
        <div class="lamp-bulb"></div>
        <div class="pull-chain"></div>
    </div>

    <div class="login-box">
        <h2>GÉNESIS AI</h2>
        <p style="color: #6133FF; font-size: 0.9em; margin-bottom: 20px;">Identificación de Investigador</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label>USUARIO</label>
                <input type="text" id="usuario" placeholder="Ingrese su usuario" required>
            </div>
            <div class="input-group">
                <label>CLAVE DE ACCESO</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-access">INICIAR NÚCLEO</button>
        </form>

        <a href="registro.html">¿No tienes cuenta? Crear Identidad</a>

        <div id="mensaje" style="margin-top: 15px; font-size: 0.8em; color: #ff3333;"></div>
        
        <div class="footer-logo">
            GENESIS IA PLATAFORMA <br>
            Investigación Biotecnológica y Fusión
        </div>
    </div>

    <script>
        // Animación de tirón y balanceo de la lámpara al hacer clic
        const lamp = document.getElementById('lampTrigger');
        lamp.addEventListener('click', () => {
            // Alterna el estado de la luz
            document.body.classList.toggle('light-on');

            // Aplica la animación física de balanceo
            lamp.classList.remove('swing');
            void lamp.offsetWidth; // Reinicia la animación CSS
            lamp.classList.add('swing');
        });

        // Lógica de inicio de sesión conectada al núcleo /api/auth
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('password').value;
            const mensaje = document.getElementById('mensaje');

            mensaje.innerText = "Agatha: Verificando credenciales en el núcleo...";
            mensaje.style.color = "#6133FF";

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: user, 
                        password: pass, 
                        action: 'login' 
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    sessionStorage.setItem('usuario', data.user);
                    window.location.href = "panel.html";
                } else {
                    mensaje.innerText = data.error || "Acceso denegado. Verifique sus datos.";
                    mensaje.style.color = "#ff3333";
                }
            } catch (error) {
                mensaje.innerText = "Fallo crítico: No se pudo conectar con el núcleo en /api/auth.";
                mensaje.style.color = "#ff3333";
                console.error("Error de conexión:", error);
            }
        };
    </script>
</body>
</html>
