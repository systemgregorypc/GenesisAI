<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - GÉNESIS AI</title>
    <style>
        body { 
            background: #0e0e0e; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            user-select: none;
            transition: background 0.5s ease;
        }

        /* CONO DE LUZ AMBIENTAL AL ENCENDER */
        .light-beam {
            position: fixed;
            top: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 520px;
            height: 580px;
            background: radial-gradient(ellipse at top, rgba(250, 204, 21, 0.22) 0%, rgba(97, 51, 255, 0.08) 45%, transparent 75%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 1;
        }
        body.light-on .light-beam {
            opacity: 1;
        }

        /* LÁMPARA SVG INTERACTIVA ARRIBA */
        .lamp-stage {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: 240px;
            z-index: 20;
            pointer-events: none;
        }
        #cordKnob {
            cursor: grab;
            pointer-events: all;
        }
        #cordKnob:active {
            cursor: grabbing;
        }
        #bulbGlow {
            transition: fill 0.3s, filter 0.3s;
        }
        body.light-on #bulbGlow {
            fill: #facc15;
            filter: drop-shadow(0 0 18px #facc15);
        }

        .hint-text {
            position: fixed;
            top: 220px;
            font-size: 0.75em;
            color: #555;
            letter-spacing: 1px;
            transition: opacity 0.4s;
            z-index: 5;
        }
        body.light-on .hint-text {
            opacity: 0;
        }

        /* CAJA DE LOGIN CON EL ESTILO EXACTO DEL REGISTRO */
        .box { 
            position: relative;
            z-index: 10;
            background: #1a1a1a; 
            padding: 30px; 
            border-radius: 15px; 
            border: 1px solid #6133FF; 
            max-width: 350px; 
            width: 90%;
            margin: auto; 
            box-shadow: 0 0 20px rgba(97, 51, 255, 0.2); 
            text-align: center;
            margin-top: 80px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px) scale(0.97);
            transition: opacity 0.45s ease, transform 0.45s ease, visibility 0.45s;
        }
        body.light-on .box {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        h2 { color: #6133FF; margin-bottom: 20px; letter-spacing: 2px; }
        
        .input-group { text-align: left; margin: 10px 0; }
        label { color: #888; font-size: 0.75em; margin-bottom: 4px; display: block; }
        
        input { 
            width: 100%; 
            padding: 12px; 
            background: #000; 
            border: 1px solid #333; 
            color: white; 
            border-radius: 5px; 
            box-sizing: border-box;
            transition: 0.3s;
        }
        input:focus { border-color: #6133FF; outline: none; background: #111; }
        
        .btn { 
            background: #6133FF; 
            color: white; 
            border: none; 
            padding: 14px; 
            width: 100%; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 5px; 
            transition: 0.3s; 
            margin-top: 15px; 
        }
        .btn:hover { background: #4a27cc; box-shadow: 0 0 15px #6133FF; }
        
        a { color: #6133FF; text-decoration: none; font-size: 0.9em; }
        a:hover { text-decoration: underline; }
        
        .link-plan {
            color: #777;
            font-size: 0.75em;
            display: inline-block;
            margin-top: 10px;
            border-bottom: 1px dashed #444;
            padding-bottom: 2px;
            transition: color 0.3s;
        }
        .link-plan:hover { color: #facc15; }

        .footer-link { margin-top: 20px; font-size: 0.85em; }
    </style>
</head>
<body>

    <div class="light-beam"></div>

    <!-- LÁMPARA CON CORDÓN ELÁSTICO ARRASTRABLE -->
    <svg class="lamp-stage" viewBox="0 0 240 240">
        <line x1="120" y1="0" x2="120" y2="75" stroke="#444" stroke-width="3"/>
        <circle id="bulbGlow" cx="120" cy="112" r="14" fill="#2a2a2a"/>
        <path d="M 85 108 L 155 108 L 140 75 L 100 75 Z" fill="#1f1f1f" stroke="#6133FF" stroke-width="1.5"/>
        <line id="cordLine" x1="142" y1="108" x2="142" y2="175" stroke="#999" stroke-width="2"/>
        <circle id="cordKnob" cx="142" cy="175" r="7" fill="#6133FF" stroke="#fff" stroke-width="1.5"/>
    </svg>

    <div class="hint-text">↓ Hala el cordón para encender el núcleo</div>

    <!-- CAJA DE ACCESO (LOGIN) -->
    <div class="box">
        <h2>GÉNESIS AI</h2>
        <p style="font-size: 0.8em; color: #888; margin-bottom: 20px;">Identificación de Investigador</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label>USUARIO</label>
                <input type="text" id="usuario" placeholder="Ingrese su usuario" required>
            </div>
            <div class="input-group">
                <label>CLAVE DE ACCESO</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">INICIAR NÚCLEO</button>
        </form>

        <div style="margin-top: 15px;">
            <a href="https://genesis-ai.org/registrar">¿No tienes cuenta? Crear Identidad</a><br>
            <a href="https://genesis-ai.org/planes" class="link-plan">Acceso completo · $2 dólares</a>
        </div>

        <div id="mensaje" style="margin-top: 15px; font-size: 0.8em; color: #ff3333;"></div>
        
        <div class="footer-link">
            <span style="font-size: 0.7em; color: #444;">GENESIS IA PLATAFORMA<br>Investigación Biotecnológica y Fusión</span>
        </div>
    </div>

    <script>
        // FÍSICA DE RESORTE DEL CORDÓN
        const knob = document.getElementById('cordKnob');
        const line = document.getElementById('cordLine');
        const lampStage = document.querySelector('.lamp-stage');

        const restX = 142, restY = 175;
        let x = restX, y = restY;
        let vx = 0, vy = 0;
        let isDragging = false;
        let toggledThisPull = false;

        function getPointerPos(e) {
            const rect = lampStage.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: ((clientX - rect.left) / rect.width) * 240,
                y: ((clientY - rect.top) / rect.height) * 240
            };
        }

        const startDrag = () => { isDragging = true; toggledThisPull = false; };
        const onDrag = (e) => {
            if (!isDragging) return;
            const pos = getPointerPos(e);
            x = Math.max(80, Math.min(200, pos.x));
            y = Math.max(110, Math.min(225, pos.y));
            if (y - restY > 25 && !toggledThisPull) {
                document.body.classList.toggle('light-on');
                toggledThisPull = true;
            }
        };
        const endDrag = () => {
            if (!isDragging) return;
            if (!toggledThisPull && Math.hypot(x - restX, y - restY) < 8) {
                document.body.classList.toggle('light-on');
            }
            isDragging = false;
        };

        knob.addEventListener('mousedown', startDrag);
        knob.addEventListener('touchstart', startDrag, { passive: true });
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('touchmove', onDrag, { passive: true });
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function animateCord() {
            if (!isDragging) {
                const ax = (restX - x) * 0.14;
                const ay = (restY - y) * 0.14;
                vx = (vx + ax) * 0.82;
                vy = (vy + ay) * 0.82;
                x += vx;
                y += vy;
            }
            knob.setAttribute('cx', x);
            knob.setAttribute('cy', y);
            line.setAttribute('x2', x);
            line.setAttribute('y2', y);
            requestAnimationFrame(animateCord);
        }
        animateCord();

        // LÓGICA DE LOGIN ORIGINAL (/api/auth)
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const user = document.getElementById('usuario').value.trim();
            const pass = document.getElementById('password').value;
            const mensaje = document.getElementById('mensaje');

            mensaje.innerText = "Agatha: Verificando credenciales en el núcleo...";
            mensaje.style.color = "#6133FF";

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: user, 
                        password: pass, 
                        action: 'login' 
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    sessionStorage.setItem('usuario', data.user);
                    window.location.href = "panel.html";
                } else {
                    mensaje.innerText = data.error || "Acceso denegado. Verifique sus datos.";
                    mensaje.style.color = "#ff3333";
                }
            } catch (error) {
                mensaje.innerText = "Fallo crítico: No se pudo conectar con el núcleo en /api/auth.";
                mensaje.style.color = "#ff3333";
                console.error("Error de conexión:", error);
            }
        };
    </script>
</body>
</html>
