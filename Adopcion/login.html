<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - GÉNESIS AI</title>
    <style>
        body { 
            background: #0e0e0e; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            transition: background 0.3s, color 0.3s;
        }

        /* ESTILOS DE LA LÁMPARA */
        .lamp-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .lamp-cord {
            width: 2px;
            height: 35px;
            background: #555;
            margin: 0 auto;
        }
        .lamp-bulb {
            width: 26px;
            height: 26px;
            background: #222;
            border-radius: 50%;
            margin: 0 auto;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
            transition: background 0.3s, box-shadow 0.3s;
        }

        /* ESTADO ENCENDIDO DE LA LÁMPARA */
        body.light-on {
            background: #f1f5f9;
            color: #0e0e0e;
        }
        body.light-on .login-box {
            background: #ffffff;
            border-color: #cbd5e1;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        body.light-on .lamp-bulb {
            background: #facc15;
            box-shadow: 0 0 30px #facc15, 0 0 60px #facc15;
        }
        body.light-on input {
            background: #f8fafc;
            color: #0e0e0e;
            border-color: #cbd5e1;
        }
        body.light-on label {
            color: #555;
        }
        body.light-on .footer-logo {
            color: #888;
        }

        .login-box { 
            background: #1a1a1a; 
            padding: 40px; 
            border-radius: 15px; 
            border: 1.5px solid #6133FF; 
            box-shadow: 0 0 20px rgba(97, 51, 255, 0.2); 
            width: 350px; 
            text-align: center;
            transition: background 0.3s, border 0.3s;
        }
        h2 { color: #6133FF; margin-bottom: 30px; letter-spacing: 3px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { color: #888; font-size: 0.8em; margin-bottom: 5px; display: block; }
        input { 
            width: 100%; 
            padding: 12px; 
            background: #222; 
            border: 1px solid #333; 
            border-radius: 5px; 
            color: white; 
            box-sizing: border-box;
            transition: 0.3s;
        }
        input:focus { border-color: #6133FF; outline: none; background: #2a2a2a; }
        .btn-access { 
            width: 100%; 
            padding: 12px; 
            background: #6133FF; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1em;
            margin-top: 10px;
        }
        .btn-access:hover { background: #4b28cc; }
        .footer-logo { margin-top: 30px; font-size: 0.7em; color: #444; }
        a { color: #6133FF; text-decoration: none; font-size: 0.85em; display: block; margin-top: 15px; }
    </style>
</head>
<body>

    <!-- LÁMPARA INTERACTIVA -->
    <div class="lamp-container">
        <div class="lamp-cord"></div>
        <div class="lamp-bulb" id="lamp" title="Haz clic para encender o apagar la luz"></div>
    </div>

    <div class="login-box">
        <h2>GÉNESIS AI</h2>
        <p style="color: #6133FF; font-size: 0.9em; margin-bottom: 20px;">Identificación de Investigador</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label>USUARIO</label>
                <input type="text" id="usuario" placeholder="Ingrese su usuario" required>
            </div>
            <div class="input-group">
                <label>CLAVE DE ACCESO</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-access">INICIAR NÚCLEO</button>
        </form>

        <a href="registro.html">¿No tienes cuenta? Crear Identidad</a>

        <div id="mensaje" style="margin-top: 15px; font-size: 0.8em; color: #ff3333;"></div>
        
        <div class="footer-logo">
            GENESIS IA PLATAFORMA <br>
            Investigación Biotecnológica y Fusión
        </div>
    </div>

    <script>
        // Interruptor táctil de la lámpara
        const lamp = document.getElementById('lamp');
        lamp.addEventListener('click', () => {
            document.body.classList.toggle('light-on');
        });

        // Lógica original de inicio de sesión con el endpoint /api/auth
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('password').value;
            const mensaje = document.getElementById('mensaje');

            mensaje.innerText = "Agatha: Verificando credenciales en el núcleo...";
            mensaje.style.color = "#6133FF";

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: user, 
                        password: pass, 
                        action: 'login' 
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    sessionStorage.setItem('usuario', data.user);
                    window.location.href = "panel.html";
                } else {
                    mensaje.innerText = data.error || "Acceso denegado. Verifique sus datos.";
                    mensaje.style.color = "#ff3333";
                }
            } catch (error) {
                mensaje.innerText = "Fallo crítico: No se pudo conectar con el núcleo en /api/auth.";
                mensaje.style.color = "#ff3333";
                console.error("Error de conexión:", error);
            }
        };
    </script>
</body>
</html>
